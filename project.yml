name: HoloDash
options:
  bundleIdPrefix: com.rishabh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "HoloDash uses your location to show your speed and turn-by-turn guidance on the heads-up display."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ITSAppUsesNonExemptEncryption: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  HoloDash:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishabh.holodash
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
